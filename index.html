<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap">
<style>
:root{--bg:#f4f1ff;--card:#fff;--ink:#26224a;--mut:#6e6a8f;--acc:#7c4dff;--acc2:#ff7a59;--ok:#12b886;--bad:#f03e3e;--line:#e4defa;--t1:#7c4dff;--t2:#ff7a59;--t3:#12b886;--t4:#339af0;--sh:0 6px 18px rgba(80,60,160,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14122b;--card:#1f1c3d;--ink:#f1eeff;--mut:#a7a2d0;--acc:#9775fa;--acc2:#ff8e72;--ok:#38d9a9;--bad:#ff6b6b;--line:#322e5c;--t1:#8c68f5;--t2:#ff8660;--t3:#20c997;--t4:#4dabf7;--sh:0 6px 18px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#14122b;--card:#1f1c3d;--ink:#f1eeff;--mut:#a7a2d0;--acc:#9775fa;--acc2:#ff8e72;--ok:#38d9a9;--bad:#ff6b6b;--line:#322e5c;--t1:#8c68f5;--t2:#ff8660;--t3:#20c997;--t4:#4dabf7;--sh:0 6px 18px rgba(0,0,0,.35)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);background-image:radial-gradient(900px 420px at 90% -10%,color-mix(in srgb,var(--acc) 20%,transparent),transparent),radial-gradient(700px 380px at -10% 110%,color-mix(in srgb,var(--acc2) 16%,transparent),transparent);background-attachment:fixed;color:var(--ink);font:16px/1.5 Nunito,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 56px}
h1{font-size:28px;font-weight:800;margin:0 0 4px;color:var(--t1)}
h2{font-size:19px;font-weight:800;margin:0 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:var(--sh)}
button,.btn{font:inherit;font-weight:700;cursor:pointer;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;transition:transform .08s,box-shadow .15s}
button:hover{transform:translateY(-1px)}button:active{transform:translateY(2px)}
button:disabled{opacity:.5;cursor:default}
button.p{background:linear-gradient(135deg,var(--acc),#b197fc);border-color:transparent;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
button.g{border:none;background:none;color:var(--mut);padding:6px 0;box-shadow:none}
button.sm{padding:6px 10px;border-radius:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
input,textarea,select{font:inherit;padding:10px 12px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
input,textarea{width:100%}input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc)}
textarea{min-height:180px}
.hero{background:linear-gradient(135deg,var(--t1),#b197fc 55%,var(--t2));color:#fff;border-radius:24px;padding:18px;margin:4px 0 6px;box-shadow:var(--sh);display:grid;gap:8px}
.hero h1{background:none;color:#fff;-webkit-text-fill-color:#fff;margin:0}.hero p{margin:0;opacity:.92}.hero small{opacity:.92}
.lvl{display:flex;align-items:center;gap:10px}.lvl span{font-size:32px;line-height:1}.lvl small{margin-left:auto}
.hb{background:rgba(255,255,255,.3)}.hb i{background:#fff}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}
.tl{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px 8px;border:none;color:#fff;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.2);font-size:16px;text-align:center}
.tl span{font-size:38px;line-height:1.1}.tl small{font-weight:600;opacity:.92}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}
.book{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bi{flex:1;min-width:140px}.bi h2{margin:0;font-size:17px}
.ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:26px}
.acts{display:flex;gap:6px;align-items:center}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.games button{padding:16px 8px;text-align:center;border-radius:18px;box-shadow:var(--sh);font-size:17px}
.games small{font-weight:600;color:var(--mut)}
.games button:nth-child(4n+1){border-color:var(--t1)}.games button:nth-child(4n+2){border-color:var(--t2)}.games button:nth-child(4n+3){border-color:var(--t3)}.games button:nth-child(4n+4){border-color:var(--t4)}
.flash{min-height:220px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:23px;font-weight:700;padding:24px;cursor:pointer;user-select:none;border-color:var(--acc);background:linear-gradient(135deg,var(--card),color-mix(in srgb,var(--acc) 14%,var(--card)))}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{min-height:84px;font-size:13px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;word-break:break-word;border-radius:16px}
.tile.dn{background:var(--ok);color:#fff;border-color:var(--ok)}.tile.up{background:var(--acc);color:#fff;border-color:var(--acc)}
.lt{font-size:24px;font-weight:800;letter-spacing:4px;text-align:center;margin:12px 0;word-break:break-word}
.kb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.kb button{width:38px;padding:8px 0;border-radius:12px}
.bar{height:10px;border-radius:10px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--t1),var(--t2));border-radius:10px;transition:width .3s}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.wrap{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;opacity:0;transition:.25s;z-index:20;pointer-events:none;max-width:90vw;text-align:center}#toast.show{opacity:1;transform:translate(-50%,0)}
.cf{position:fixed;top:-40px;z-index:30;pointer-events:none;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px;letter-spacing:.2px}.brand svg{flex:none;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.chip{padding:5px 12px;border-radius:999px;font-size:14px;border:2px solid var(--line);background:var(--card);font-weight:700;color:var(--ink)}button.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}.mini{padding:3px 6px;font-size:13px;border-radius:10px}.goal{margin-top:2px}.opt.sel{background:var(--acc);color:#fff;border-color:var(--acc)}.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match>div{display:grid;gap:8px;align-content:start}
button:focus-visible,[data-c]:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-width:480px){.games button:last-child:nth-child(odd){grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){button{transition:none}}
.ball{color:#fff;border:none;border-radius:50% 50% 46% 46%;min-height:104px;padding:16px 14px;line-height:1.3;font-size:16px;animation:bob 2.6s ease-in-out infinite alternate}
.ball:nth-child(2n){animation-delay:-1.1s}
@keyframes bob{to{transform:translateY(-6px)}}
.badges{display:flex;flex-wrap:wrap;gap:8px}.bdg{padding:6px 10px;border-radius:999px;border:2px solid var(--line);font-weight:700;font-size:14px}.bdg.on{background:var(--acc);border-color:var(--acc);color:#fff}.bdg.off{opacity:.45}
html.big body{font-size:19px}html.big h1{font-size:34px}html.big h2{font-size:23px}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
</style></head><body><main id="app"></main>
<script>
const K='studiestart.v1';
const demo={id:'demo',title:'Voorbeeld: Biologie hoofdstuk 1',cards:[
['Cel','Kleinste eenheid van leven'],['Celkern','Bevat het erfelijk materiaal (DNA)'],['Mitochondrie','Zet voedingsstoffen om in energie'],
['Chloroplast','Hier vindt fotosynthese plaats'],['Celmembraan','Bepaalt wat de cel in en uit mag'],['Ribosoom','Maakt eiwitten aan'],
['Fotosynthese','Zonlicht, water en CO2 worden suiker en zuurstof'],['Weefsel','Groep cellen met dezelfde functie']].map(x=>({t:x[0],d:x[1]}))};
let books=null;try{books=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!Array.isArray(books)){books=[demo];save()}
function save(){try{localStorage.setItem(K,JSON.stringify(books))}catch(e){}}
const app=document.getElementById('app');
let s={v:'home'},g=null;
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const bk=()=>books.find(b=>b.id===s.id);
function go(v,o){s=Object.assign({v},o||{});g=null;render();window.scrollTo(0,0)}
function parse(txt){const out=[];txt.split(/\r?\n/).forEach(l=>{l=l.replace(/^\uFEFF/,'').trim().replace(/^(?:\d{1,3}[.)]|[-•*])\s+/,'');if(!l)return;
 const m=l.match(/^(.+?)\s*(?:\t|=|:|;| - )\s*(.+)$/)||l.match(/^(.+?)\s*,\s*(.+)$/),q=x=>x.trim().replace(/^"|"$/g,'').trim();
 if(m&&q(m[1])&&q(m[2]))out.push({t:q(m[1]),d:q(m[2])})});return out}
function render(){if(!TOK){terms();return}({home,book,add,game,cat,games})[s.v]();if(app.querySelector&&app.querySelector('[data-win]')){party();snd(2)}}
const LV={vmbo:4,havo:5,vwo:6},ALL=['vmbo','havo','vwo'],HV=['havo','vwo'];
const S4=['A','B','C','D'];
const M=[['Wiskunde','Getal & Ruimte',ALL,1,6,S4],['Wiskunde','Moderne Wiskunde',ALL,1,6,S4],
['Nederlands','Nieuw Nederlands',ALL,1,6],['Nederlands','Op Niveau',ALL,1,6],['Nederlands','Talent',HV,1,6],
['Engels','Stepping Stones',ALL,1,3],['Engels','KERN Engels',ALL,1,3],['Engels','Network',ALL,1,6],['Engels','High Note',HV,4,6],['Engels','Of Course!',ALL,1,6],
['Frans','Grandes Lignes',HV,1,6],['Frans','\u00c0 plus !',HV,1,6],
['Duits','Na Klar!',ALL,1,6],['Duits','Neue Kontakte',ALL,1,6],['Duits','TrabiTour',HV,1,3],
['Biologie','Nectar',ALL,1,6],['Biologie','Biologie voor jou',ALL,1,6],
['NaSk','Overal NaSk',ALL,1,2],['NaSk','Pulsar NaSk',ALL,1,2],['NaSk','Overal NaSk 1',['vmbo'],3,4],['NaSk','Overal NaSk 2',['vmbo'],3,4],['NaSk','Pulsar NaSk 1',['vmbo'],3,4],['NaSk','Pulsar NaSk 2',['vmbo'],3,4],
['Natuurkunde','Overal Natuurkunde',ALL,3,6],['Natuurkunde','Pulsar Natuurkunde',HV,4,6],['Natuurkunde','Newton',HV,4,6],['Natuurkunde','Systematische Natuurkunde',HV,4,6],['Natuurkunde','Nova',ALL,2,6],
['Scheikunde','Chemie Overal',ALL,3,6],['Scheikunde','Pulsar Chemie',HV,4,6],['Scheikunde','Nova',ALL,2,6],
['Aardrijkskunde','De Geo',ALL,1,6],['Aardrijkskunde','The Geo (tweetalig)',HV,1,3],['Aardrijkskunde','buiteNLand',HV,1,6],['Aardrijkskunde','De Wereld van',ALL,1,6],['Aardrijkskunde','Meander',ALL,1,6],
['Geschiedenis','Feniks',ALL,1,6],['Geschiedenis','Geschiedeniswerkplaats',ALL,1,6],['Geschiedenis','Memo',ALL,1,6],
['Economie','Pincode',ALL,2,6],['Economie','Praktische Economie',HV,4,6],['Economie','Economie Integraal',HV,3,6],['Bedrijfseconomie','Pincode Bedrijfseconomie',HV,4,6],
['Maatschappijleer',"Thema's Maatschappijleer",HV,4,6],['Maatschappijleer','Dilemma',HV,1,3],['Mens & Maatschappij','Mundo',ALL,1,3]];
const CAT=[];M.forEach(([v,m,ns,y0,y1,subs])=>ns.forEach(n=>{for(let j=y0;j<=Math.min(y1,LV[n]);j++){if(subs&&j>=4&&n!=='vmbo')subs.forEach(s=>CAT.push({v,m,n,j,s}));else CAT.push({v,m,n,j})}}));
const cid=c=>c.m+'|'+c.n+'|'+c.j+(c.s?'|'+c.s:'');
let F={n:'',j:'',v:'',q:''};
function cat(){
 const vs=[...new Set(M.map(x=>x[0]))];const o=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
 app.innerHTML=`<button class="g" data-c="go('home')">← Terug</button><h1>Boeken kiezen</h1>
 <p class="mut">Kies je niveau, leerjaar en vak en voeg toe wat jij gebruikt. Let op: de lijst is een startpunt en kan onvolledig zijn. De inhoud van de boeken zit er niet in; die voeg je zelf toe.</p>
 <div class="row"><select id="fn" data-i="1"><option value="">Alle niveaus</option>${o(ALL,F.n)}</select>
 <select id="fj" data-i="1"><option value="">Alle jaren</option>${o([1,2,3,4,5,6],F.j)}</select>
 <select id="fv" data-i="1"><option value="">Alle vakken</option>${o(vs,F.v)}</select></div>
 <input id="fq" style="margin-top:8px" placeholder="Zoek op methode of vak" value="${esc(F.q)}" data-i="1"><div id="cl"></div>`;fillList()}
function setF(){const V=id=>{const e=document.getElementById(id);return e?e.value:''};F={n:V('fn'),j:V('fj'),v:V('fv'),q:V('fq')};fillList()}
function fillList(){
 const q=F.q.toLowerCase();const r=CAT.filter(c=>(!F.n||c.n===F.n)&&(!F.j||c.j==F.j)&&(!F.v||c.v===F.v)&&(!q||(c.m+' '+(c.s||'')+' '+c.v).toLowerCase().includes(q)));
 const have=new Set(books.map(b=>b.cid));
 document.getElementById('cl').innerHTML=r.slice(0,50).map(c=>{const i=CAT.indexOf(c),id=cid(c);
 return `<div class="card row sp"><div><b>${esc(c.m)}${c.s?' '+c.s:''}</b><br><span class="mut">${c.v} · ${c.n} ${c.j}</span></div>${have.has(id)?'<span class="mut">✓ Toegevoegd</span>':`<button class="p" data-c="addCat(${i})">Toevoegen</button>`}</div>`}).join('')
 +(r.length>50?`<p class="mut">Nog ${r.length-50} meer, gebruik de filters.</p>`:'')+(r.length?'':'<p class="mut">Niets gevonden.</p>')
 +`<p class="mut">Staat jouw boek er niet bij? <a href="#" data-c="go('add')">Voeg het zelf toe</a>.</p>`}
function addCat(i){const c=CAT[i];books.push({id:'b'+Date.now(),cid:cid(c),title:c.m+(c.s?' '+c.s:'')+' — '+c.n+' '+c.j+' ('+c.v+')',cards:[]});save();fillList()}
function home(){
 const lv=LEVELS.filter(l=>PTS>=l[0]).pop(),nx=LEVELS.find(l=>l[0]>PTS);
 app.innerHTML=`<div class="hero"><div class="brand"><svg viewBox="0 0 64 64" width="46" height="46" role="img" aria-label="StudieStart logo"><defs><linearGradient id="lgo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c4dff"/><stop offset="1" stop-color="#ff7a59"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="#fff"/><path d="M10 30C19 26 27 27 32 32C37 27 45 26 54 30V50C45 46 37 47 32 52C27 47 19 46 10 50Z" fill="url(#lgo)"/><path d="M32 33V51" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".7"/><path d="M32 5L34.6 11.4L41 14L34.6 16.6L32 23L29.4 16.6L23 14L29.4 11.4Z" fill="#ff7a59"/></svg><span>StudieStart</span></div><div><h1>Hoi! 👋</h1><p>Wat ga je vandaag leren?</p></div>
 <div class="lvl"><span>${lv[1]}</span><b>${lv[2]}</b><small>⭐ ${PTS} punten</small></div>
 ${nx?`<div class="bar hb"><i style="width:${(PTS-lv[0])/(nx[0]-lv[0])*100}%"></i></div><small>Nog ${nx[0]-PTS} punten tot ${nx[2]} ${nx[1]}</small>`:'<small>Hoogste level bereikt! 👑</small>'}${goalRow()}</div>
 <div class="tiles">
 <button class="tl t1" data-c="go('games')"><span>🎮</span>Spelletjes<small>11 spellen</small></button>
 <button class="tl t2" data-c="go('cat')"><span>📖</span>Boek kiezen<small>uit de lijst</small></button>
 <button class="tl t3" data-c="go('add',{own:'1'})"><span>📝</span>Eigen lijst<small>typ of plak woorden</small></button>
 <button class="tl t4" data-c="go('add',{photo:'1'})"><span>📷</span>Foto → lijst<small>maak een foto</small></button></div>
 ${wotd()}${badges()}<h2>Mijn boeken en lijsten</h2>
 ${books.length?books.map(b=>bookCard(b)).join(''):'<p class="mut">Nog niks. Kies een boek of maak een lijst.</p>'}
 <div class="card"><b>💾 Back-up</b><p class="mut">Je lijsten staan alleen op dit apparaat. Maak een back-up om ze naar je andere apparaat te brengen.</p><div class="row"><button data-c="exportData()">⬇️ Back-up maken</button><button data-c="pickImport()">⬆️ Terugzetten</button></div><input type="file" id="imp" accept=".json,application/json" hidden></div>
 <div class="card"><b>⚙️ Instellingen</b><div class="row" style="margin-top:8px"><button class="sm" data-c="togSound()">${SOUND?'🔊 Geluid aan':'🔇 Geluid uit'}</button><span class="mut">Dagelijks doel:</span><select data-i="goal">${[10,20,50,100].map(v=>`<option ${v===GOAL?'selected':''}>${v}</option>`).join('')}</select><span class="mut">punten</span></div><div class="row" style="margin-top:8px"><span class="mut">Thema:</span><select data-i="theme"><option value="auto" ${THEME==='auto'?'selected':''}>Automatisch</option><option value="light" ${THEME==='light'?'selected':''}>Licht</option><option value="dark" ${THEME==='dark'?'selected':''}>Donker</option></select><span class="mut">Tekst:</span><select data-i="font"><option value="n" ${FONT==='n'?'selected':''}>Normaal</option><option value="l" ${FONT==='l'?'selected':''}>Groot</option></select></div></div>`;
 const im=document.getElementById('imp');if(im)im.onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)importData(f)}}
function add(){
 const b=s.edit?books.find(x=>x.id===s.edit):null;
 const H=b?'Woorden toevoegen':s.photo?'📷 Foto → woordenlijst':s.own?'📝 Eigen woordenlijst':'Boek of lijst toevoegen';
 app.innerHTML=`<button class="g" data-c="go('${b?'book':'home'}',{id:'${b?b.id:''}'})">← Terug</button><h1>${H}</h1>
 ${b?'':'<p>Naam van je lijst of boek</p><input id="ti" placeholder="bijv. Engels Unit 3">'}
 ${whereHtml(b)}
 <div class="card" id="phc"><b>📷 Foto of bestand → lijst</b>
 <p class="mut">Maak een foto van een woordenlijst, kies een bestand (foto, .txt of .csv) of plak een screenshot (Ctrl+V). De tekst wordt uitgelezen en jij controleert hem daarna.</p>
 <div class="row"><button class="p" data-c="pickPhoto('cam')">📷 Foto maken</button><button data-c="pickPhoto('file')">🖼️ Bestand kiezen</button><button data-c="pastePhoto()">📋 Plakken</button></div>
 <div id="lgrow" class="row" style="margin-top:10px"><span class="mut">Taal in de foto:</span><select data-i="lang">${Object.keys(LANGS).map(k=>`<option value="${k}" ${k===OLANG?'selected':''}>${LANGS[k][0]}</option>`).join('')}</select></div>
 <input type="file" id="ph" accept="image/*" capture="environment" hidden><input type="file" id="pf" accept="image/*,.txt,.csv,text/plain" multiple hidden>
 <p id="phs" class="mut"></p></div>
 <p>Of typ of plak je woorden: één per regel, bijvoorbeeld <code>woord = uitleg</code> (ook <code>:</code>, <code>;</code> of tab werkt).</p>
 <textarea id="tx" placeholder="mitose = celdeling&#10;apple = appel"></textarea>

function tog(k,v){s[k]=s[k]||[];const i=s[k].indexOf(v);if(i<0)s[k].push(v);else s[k].splice(i,1);render()}
function togH(a){tog('selH',+a)}function togO(a){tog('selO',String(a))}

let SOUND=true,AC=null,GOAL=20,BEST={};
try{SOUND=localStorage.getItem('studiestart.sound')!=='0';GOAL=+localStorage.getItem('studiestart.goal')||20;BEST=JSON.parse(localStorage.getItem('studiestart.best'))||{}}catch(e){}
function snd(k){if(k<2&&navigator.vibrate){try{navigator.vibrate(k?25:[60,40,60])}catch(e){}}if(!SOUND)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const seq=k===1?[[660,0],[880,.09]]:k===2?[[523,0],[659,.1],[784,.2],[1047,.3]]:[[196,0],[147,.12]];
 seq.forEach(([f,t])=>{const o=AC.createOscillator(),gn=AC.createGain(),T=AC.currentTime+t;o.type=k===0?'triangle':'sine';o.frequency.value=f;gn.gain.setValueAtTime(.0001,T);gn.gain.exponentialRampToValueAtTime(.18,T+.02);gn.gain.exponentialRampToValueAtTime(.0001,T+.16);o.connect(gn);gn.connect(AC.destination);o.start(T);o.stop(T+.18)})}catch(e){}}
function togSound(){SOUND=!SOUND;try{localStorage.setItem('studiestart.sound',SOUND?'1':'0')}catch(e){}if(SOUND)snd(1);render()}
function bestUp(k,v){const old=BEST[k]||0;if(v>old){BEST[k]=v;try{localStorage.setItem('studiestart.best',JSON.stringify(BEST))}catch(e){}return old>0?' 🏆 Nieuw record!':''}return old?` (record: ${old})`:''}
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let DAY={d:'',p:0,last:'',streak:0,gd:''};try{DAY=Object.assign(DAY,JSON.parse(localStorage.getItem('studiestart.day')))}catch(e){}
function dayState(){const t=iso(new Date()),y=iso(new Date(Date.now()-864e5));return{p:DAY.d===t?DAY.p:0,streak:(DAY.last===t||DAY.last===y)?DAY.streak:0}}
function addPts(n){const t=iso(new Date()),y=iso(new Date(Date.now()-864e5));PTS+=n;
 if(DAY.d!==t){DAY.d=t;DAY.p=0}if(DAY.last!==t){DAY.streak=DAY.last===y?DAY.streak+1:1;DAY.last=t}DAY.p+=n;
 if(DAY.p>=GOAL&&DAY.gd!==t){DAY.gd=t;toast('🎯 Dagelijks doel gehaald!')}
 try{localStorage.setItem('studiestart.pts',PTS);localStorage.setItem('studiestart.day',JSON.stringify(DAY))}catch(e){}}
function goalRow(){const d=dayState();return `<div class="goal"><div class="row sp"><small>🔥 ${d.streak} ${d.streak===1?'dag':'dagen'} op rij</small><small>🎯 Vandaag ${d.p}/${GOAL}</small></div><div class="bar hb"><i style="width:${Math.min(100,d.p/GOAL*100)}%"></i></div></div>`}
function say(){if(!('speechSynthesis' in window)||!g||!g.deck)return;const c=g.deck[g.i],o=(c&&c._)||c,b=bk(),L=[['Engels','en-GB'],['Frans','fr-FR'],['Duits','de-DE'],['Spaans','es-ES']].find(x=>b.title.includes(x[0]));
 const u=new SpeechSynthesisUtterance(o.t);u.lang=L?L[1]:'nl-NL';speechSynthesis.cancel();speechSynthesis.speak(u)}
function scNew(){const a=g.src[g.i].ans.replace(/\s/g,'');let L=[...a],t=0;if(L.length>1)do{L=shuf(L)}while(L.join('')===a&&t++<6);g.L=L;g.used=[];g.res=null}
function gScr(){
 if(g.i>=g.src.length){app.innerHTML=fin(`Score: ${g.score} / ${g.src.length}`,'scr');return}
 const c=g.src[g.i],r=g.res;
 app.innerHTML=hd(`${g.i+1} / ${g.src.length}`,g.i/g.src.length*100)+`<div class="card"><p class="mut">Zet de letters in de goede volgorde</p><h2>${esc(c.ask)}</h2>
 <div class="lt">${g.L.map((_,k)=>g.used[k]!==undefined?esc(g.L[g.used[k]]):'_').join(' ')}</div>
 ${r?`<p style="font-weight:600;color:var(--${r.ok?'ok':'bad'})">${r.ok?'✓ Goed!':'✗ Het juiste antwoord: '+esc(c.ans)}</p><button class="p" data-c="scNext()">Volgende →</button>`:`<div class="kb">${g.L.map((l,k)=>`<button data-c="scL(${k})" ${g.used.includes(k)?'disabled':''}>${esc(l)}</button>`).join('')}</div><div class="row" style="justify-content:center;margin-top:10px"><button class="sm" data-c="scBack()">⌫ Terug</button></div>`}</div>`}

 if(g.used.length===g.L.length){const ok=norm(g.used.map(i=>g.L[i]).join(''))===norm(g.src[g.i].ans.replace(/\s/g,''));g.res={ok};mark(g.src[g.i],ok);if(ok){g.score++;addPts(2);snd(1)}else snd(0)}render()}

function gMat(){
 if(g.r>=g.rs.length){app.innerHTML=fin(`${g.score} paren goed, ${g.wrong} fout`,'mat');return}

function matTap(sd,i){

  else{g.wrong++;mark(g.P[sd==='L'?i:g.sel.i],false);snd(0);g.sel=null}}
 else g.sel={s:sd,i};render()}

function run(c){let m;c=c.trim();
